name: snbt_tracker
description: "SNBT Study Tracker — Gamified habit tracker untuk persiapan SNBT 2027. Offline, no server."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter

  # State management
  provider: ^6.1.2

  # Database — sqflite (Android/iOS) + sqflite_common_ffi (Windows)
  sqflite: ^2.4.1
  sqflite_common_ffi: ^2.3.4+4
  sqflite_common_ffi_web: ^1.1.2
  path: ^1.9.0
  path_provider: ^2.1.5

  # Charts
  fl_chart: ^0.71.0

  # Audio
  audioplayers: ^6.4.0

  # Notifications — Android only, best-effort on other platforms
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4

  # File I/O for export/import (path_provider already listed above)

  # Utilities
  intl: ^0.20.2
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/materi-snbt.json
    - assets/sfx/check.wav

  fonts:
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-Regular.ttf
          weight: 400
        - asset: assets/fonts/Nunito-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Nunito-Bold.ttf
          weight: 700
        - asset: assets/fonts/Nunito-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Nunito-Black.ttf
          weight: 900
